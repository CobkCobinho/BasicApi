name: Build

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependências
        run: dotnet restore EmployeeApi.sln

      - name: Compilar
        run: dotnet build EmployeeApi.sln --no-restore --configuration Release

      - name: Executar testes de integração
        run: dotnet test EmployeeApi.sln --no-build --configuration Release
